<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Full-stack application architecture illustration</title>
  <rect width="1200" height="630" fill="#f5f2f4"/>
  <rect x="60" y="60" width="260" height="120" rx="12" fill="#6c63ff"/>
  <text x="190" y="110" font-family="Montserrat, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">UI / Components</text>
  <text x="190" y="145" font-family="Montserrat, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">React · State · Props</text>
  <path d="M320 120 L380 120" stroke="#6c63ff" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
  <rect x="400" y="60" width="260" height="120" rx="12" fill="#8c43ce"/>
  <text x="530" y="110" font-family="Montserrat, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">API Layer</text>
  <text x="530" y="145" font-family="Montserrat, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">REST · JSON · Auth</text>
  <path d="M660 120 L720 120" stroke="#6c63ff" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
  <rect x="740" y="60" width="260" height="120" rx="12" fill="#6c63ff"/>
  <text x="870" y="110" font-family="Montserrat, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Database</text>
  <text x="870" y="145" font-family="Montserrat, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">Schema · Relations</text>
  <rect x="60" y="300" width="1080" height="60" rx="8" fill="#ffffff" stroke="#d9dbdf" stroke-width="2"/>
  <text x="600" y="338" font-family="Montserrat, sans-serif" font-size="24" font-weight="700" fill="#262626" text-anchor="middle">Deploy → Container → Domain</text>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6c63ff"/>
    </marker>
  </defs>
</svg>