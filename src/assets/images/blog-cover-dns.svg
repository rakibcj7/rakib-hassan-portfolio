<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Understanding how the web works</title>
  <rect width="1200" height="630" fill="#f5f2f4"/>
  <rect x="80" y="90" width="200" height="80" rx="12" fill="#6c63ff"/>
  <text x="180" y="140" font-family="Montserrat, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Browser</text>
  <path d="M290 130 L360 130" stroke="#6c63ff" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <rect x="380" y="90" width="200" height="80" rx="12" fill="#8c43ce"/>
  <text x="480" y="140" font-family="Montserrat, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">DNS</text>
  <path d="M590 130 L660 130" stroke="#6c63ff" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <rect x="680" y="90" width="200" height="80" rx="12" fill="#6c63ff"/>
  <text x="780" y="140" font-family="Montserrat, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Server</text>
  <rect x="80" y="260" width="1040" height="60" rx="10" fill="#ffffff" stroke="#d9dbdf" stroke-width="2"/>
  <text x="600" y="298" font-family="Montserrat, sans-serif" font-size="24" font-weight="700" fill="#262626" text-anchor="middle">GET /index.html → 200 OK</text>
  <rect x="80" y="370" width="1040" height="60" rx="10" fill="#ffffff" stroke="#d9dbdf" stroke-width="2"/>
  <text x="600" y="408" font-family="Montserrat, sans-serif" font-size="24" font-weight="700" fill="#262626" text-anchor="middle">Render HTML → Paint pixels</text>
  <rect x="80" y="480" width="1040" height="60" rx="10" fill="#ffffff" stroke="#d9dbdf" stroke-width="2"/>
  <text x="600" y="518" font-family="Montserrat, sans-serif" font-size="24" font-weight="700" fill="#262626" text-anchor="middle">User sees the page</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6c63ff"/>
    </marker>
  </defs>
</svg>