<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>React vs Next.js</title>
  <rect width="1200" height="630" fill="#f5f2f4"/>
  <rect x="80" y="80" width="460" height="200" rx="14" fill="#6c63ff"/>
  <text x="310" y="135" font-family="Montserrat, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">React</text>
  <text x="310" y="175" font-family="Montserrat, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">UI Library</text>
  <text x="310" y="215" font-family="Montserrat, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Build components · Manage state</text>
  <text x="310" y="250" font-family="Montserrat, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">You handle routing &amp; SEO</text>
  <rect x="660" y="80" width="460" height="200" rx="14" fill="#8c43ce"/>
  <text x="890" y="135" font-family="Montserrat, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Next.js</text>
  <text x="890" y="175" font-family="Montserrat, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">Framework</text>
  <text x="890" y="215" font-family="Montserrat, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Routing · SSR · SSG</text>
  <text x="890" y="250" font-family="Montserrat, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">SEO &amp; performance built in</text>
  <rect x="80" y="400" width="1040" height="60" rx="10" fill="#ffffff" stroke="#d9dbdf" stroke-width="2"/>
  <text x="600" y="438" font-family="Montserrat, sans-serif" font-size="24" font-weight="700" fill="#262626" text-anchor="middle">Choose React for SPAs · Choose Next.js for production sites</text>
</svg>